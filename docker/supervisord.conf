[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
autorestart=true

[program:backend]
command=/opt/venv/bin/python -m uvicorn gh_tap_back.app:main --host 127.0.0.1 --port 8000 --workers 3
directory=/app/backend/src
environment=PYTHONPATH="/app/backend/src",PATH="/opt/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.log
autorestart=true
